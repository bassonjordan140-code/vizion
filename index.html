<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ViZion</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="logo">

            <img src="images/logo-vizion-sauge.png"
                 alt="Logo Vizion"
                 class="logo-image">

        </div>

        <p class="subtitle">

            Plateforme de récolte de données pour audit énergétique
            et rétrocommissioning.

        </p>

        <button class="choice-button"
                onclick="window.location.href='pages/audit-menu.html'">

            <span class="icon-badge">
                <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="18" x2="4" y2="12"></line>
                    <line x1="9.5" y1="18" x2="9.5" y2="8"></line>
                    <line x1="15" y1="18" x2="15" y2="4"></line>
                    <line x1="20" y1="18" x2="20" y2="11"></line>
                </svg>
            </span>

            <span>

                <strong>
                    Audit énergétique
                </strong>

                <small>
                    Informations sur les équipements,
                    logements, restaurants, etc.
                </small>

            </span>

        </button>

        <button class="choice-button">

            <span class="icon-badge">
                <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2z"></path>
                </svg>
            </span>

            <span>

                <strong>
                    Rétrocommissioning
                </strong>

                <small>
                    Évaluation complète, réglages
                    et ajustements des systèmes.
                </small>

            </span>

        </button>

        <footer>
            ViZion v0.1 — Développé par Jordan BASSON
        </footer>

    </div>

    <script>
        // Sans ce listener, Chrome/WebView (Android et iOS) n'applique jamais
        // :active au toucher — connu pour désactiver l'effet de survol/appui
        // tant qu'aucun gestionnaire touchstart n'existe sur la page.
        document.addEventListener("touchstart", function () {}, { passive: true });
    </script>

</body>

</html>
