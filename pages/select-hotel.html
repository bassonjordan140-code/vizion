<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sélection de l'hôtel</title>

    <link rel="stylesheet"
          href="../css/style.css">
</head>

<body>

    <div class="container">

        <button class="back-icon-button"
                id="backToHomeButton">
            ←
        </button>

        <h1>Quel hôtel suivez-vous ?</h1>

        <p class="subtitle">
            Ce choix alimente la page de garde du rapport.
        </p>

        <div class="module-detail-card">

            <div class="field-group">
                <label for="hotelSelect">Hôtel</label>
                <select id="hotelSelect">
                    <option value="">— Sélectionner un hôtel —</option>
                </select>
            </div>

            <div id="hotelPreview" class="section-hint hidden"></div>

        </div>

        <button class="primary-button"
                id="continueButton"
                disabled>
            Continuer
        </button>

    </div>

    <script src="../js/secteur-config.js"></script>
    <script src="../js/photo-manager.js"></script>
    <script src="../js/building-manager.js"></script>
    <script src="../js/hotels-data.js"></script>
    <script src="../js/select-hotel.js"></script>

</body>

</html>
