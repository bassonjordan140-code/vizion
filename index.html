<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ViZion</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="logo">

            <img src="images/Nouveau%20logo_viszion.png"
                 alt="Logo Vizion"
                 class="logo-image">

        </div>

        <p class="subtitle">

            Plateforme de récolte de données pour audit énergétique
            et rétrocommissioning.

        </p>

        <button class="choice-button"
                onclick="window.location.href='pages/select-hotel.html'">

            <span class="icon">⚡</span>

            <span>

                <strong>
                    Audit énergétique
                </strong>

                <small>
                    Informations sur les équipements,
                    logements, restaurants, etc.
                </small>

            </span>

        </button>

        <button class="choice-button">

            <span class="icon">🔧</span>

            <span>

                <strong>
                    Rétrocommissioning
                </strong>

                <small>
                    Évaluation complète, réglages
                    et ajustements des systèmes.
                </small>

            </span>

        </button>

        <footer>
            ViZion v0.1 — Développé par Jordan BASSON
        </footer>

    </div>

    <script>
        // Sans ce listener, Chrome/WebView (Android et iOS) n'applique jamais
        // :active au toucher — connu pour désactiver l'effet de survol/appui
        // tant qu'aucun gestionnaire touchstart n'existe sur la page.
        document.addEventListener("touchstart", function () {}, { passive: true });
    </script>

</body>

</html>
