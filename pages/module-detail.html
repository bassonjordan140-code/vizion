<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Localisation</title>

    <link rel="stylesheet"
          href="../css/style.css">
</head>

<body>

    <div class="container">

        <button class="back-icon-button"
                onclick="window.location.href='audit.html'">
            ←
        </button>

        <h1 id="moduleTitle">
            Secteur
        </h1>

        <p class="subtitle"
           id="moduleSubtitle">
            Sélectionnez la localisation à auditer, ou ajoutez-en une nouvelle.
        </p>

        <div class="module-detail-card">
            <div class="field-group">
                <label for="newLocalisationInput">Nouvelle localisation</label>
                <input type="text" id="newLocalisationInput" placeholder="Ex : Chambre de luxe, Bureau direction…">
            </div>
            <button type="button" id="addLocalisationBtn" class="secondary-button">
                + Ajouter une localisation
            </button>
        </div>

        <div id="duplicatePanel" class="module-detail-card hidden">
            <h2 class="section-title">Dupliquer "<span id="duplicateSourceName"></span>"</h2>
            <p class="section-hint">
                Choisissez le bâtiment de destination. La copie pourra ensuite être
                modifiée librement, indépendamment de l'originale.
            </p>
            <div class="field-group">
                <label for="duplicateTargetSelect">Bâtiment</label>
                <select id="duplicateTargetSelect"></select>
            </div>
            <button type="button" id="duplicateConfirmBtn" class="secondary-button">
                Dupliquer
            </button>
            <button type="button" id="duplicateCancelBtn" class="secondary-button">
                Annuler
            </button>
        </div>

        <div id="moduleContent"
             class="dashboard-list">
        </div>

    </div>

    <script src="../js/secteur-config.js"></script>
    <script src="../js/photo-manager.js"></script>
    <script src="../js/building-manager.js"></script>
    <script src="../js/progress.js"></script>
    <script src="../js/module-detail.js"></script>

</body>

</html>
