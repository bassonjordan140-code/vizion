<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fiche salle de réunion</title>

    <link rel="stylesheet"
          href="../css/style.css">
</head>

<body>

    <div class="container">

        <button class="back-icon-button"
                onclick="UnsavedGuard.confirmLeave('module-detail.html')">
            ←
        </button>

        <h1 id="reunionTitle">Salle de réunion</h1>

        <p class="location-context" id="locationContext"></p>

        <p class="subtitle">
            Identification et équipements de la salle de réunion / séminaire.
        </p>

        <!-- IDENTIFICATION -->

        <div class="module-detail-card">

            <p class="section-title">Identification</p>

            <div class="field-group">
                <label>Nom / désignation</label>
                <input type="text"
                       id="nomReunion"
                       placeholder="Ex : Salle Hibiscus">
            </div>

            <div class="field-group">
                <label>Places assises</label>
                <input type="number"
                       id="placesAssises"
                       min="0" step="1"
                       inputmode="numeric"
                       placeholder="Ex : 30">
            </div>

            <div class="field-group">
                <label>Fréquence d'utilisation estimée</label>
                <select id="frequence">
                    <option value="Quotidienne">Quotidienne</option>
                    <option value="Plusieurs fois / semaine">Plusieurs fois / semaine</option>
                    <option value="Hebdomadaire">Hebdomadaire</option>
                    <option value="Occasionnelle">Occasionnelle</option>
                </select>
            </div>

            <div class="field-group" style="margin-top: 24px;">
                <label>Photo générale</label>
                <div class="photo-slot" data-photo-field="general"></div>
            </div>

        </div>

        <!-- CLIMATISATION -->

        <div class="module-detail-card">

            <p class="section-title">Climatisation</p>

            <div class="toggle-group">
                <label>Salle climatisée ?</label>
                <div class="toggle-buttons" id="climToggle">
                    <button type="button" class="toggle-btn" data-value="non">Non</button>
                    <button type="button" class="toggle-btn" data-value="oui">Oui</button>
                </div>
            </div>

            <div id="climContent" class="hidden">

                <div class="toggle-group">
                    <label>Climatisation centralisée ?</label>
                    <div class="toggle-buttons" id="climCentraliseeToggle">
                        <button type="button" class="toggle-btn" data-value="non">Non (splits)</button>
                        <button type="button" class="toggle-btn" data-value="oui">Oui</button>
                    </div>
                </div>

                <div id="climSplitsContent">

                    <div class="field-group">
                        <label>Nombre de climatiseurs</label>
                        <input type="number" id="climNombre" min="0" step="1" inputmode="numeric" value="0">
                    </div>

                    <div class="field-group">
                        <label>Puissance unitaire (W)</label>
                        <input type="number" id="climPuissance" min="0" step="1" inputmode="numeric" placeholder="Ex : 2500">
                    </div>

                </div>

                <div class="field-group">
                    <label>État du système</label>
                    <select id="climEtat">
                        <option value="Bon">Bon</option>
                        <option value="Moyen">Moyen</option>
                        <option value="Dégradé">Dégradé</option>
                    </select>
                </div>

                <div class="field-group">
                    <label>Photo du climatiseur</label>
                    <div class="photo-slot" data-photo-field="clim"></div>
                </div>

                <div class="toggle-group">
                    <label>Plaque signalétique visible ?</label>
                    <div class="toggle-buttons" id="plaqueToggle">
                        <button type="button" class="toggle-btn" data-value="non">Non</button>
                        <button type="button" class="toggle-btn" data-value="oui">Oui</button>
                    </div>
                </div>

                <div id="plaquePhotoContainer" class="hidden">
                    <div class="field-group">
                        <label>Photo de la plaque signalétique</label>
                        <div class="photo-slot" data-photo-field="clim_plaque"></div>
                    </div>
                </div>

            </div>


        </div>

        <!-- ÉQUIPEMENTS -->

        <div class="module-detail-card">

            <p class="section-title">Équipements</p>

            <p class="section-hint">
                Ajoutez librement les équipements présents (pas de liste prédéfinie).
            </p>

            <div id="customEquipementsList"></div>

            <div class="field-group" style="margin-top: 16px;">
                <label>Ajouter un équipement</label>
                <input type="text" id="nouvelEquipementInput" placeholder="Ex : Vidéoprojecteur, Écran plat, Sonorisation…">
            </div>

            <div id="equipSuggestions" class="equip-suggestions hidden"></div>

            <button type="button"
                    class="add-row-button"
                    id="addEquipementButton">
                + Ajouter cet équipement
            </button>

        </div>

        <!-- ÉCLAIRAGE -->

        <div class="module-detail-card">

            <p class="section-title">Éclairage</p>

            <p class="section-hint">
                Listez les types d'ampoules présentes.
            </p>

            <div id="eclairageList" class="eclairage-list"></div>

            <button type="button" class="add-row-button" id="addEclairageButton">
                + Ajouter type d'éclairage
            </button>

        </div>

        <!-- OBSERVATIONS -->

        <div class="module-detail-card">

            <p class="section-title">Observations</p>

            <p class="section-hint">
                Remarques terrain sur cette salle.
            </p>

            <textarea id="observations"
                      class="commentaire-textarea"
                      rows="5"
                      placeholder="Ex : Vidéoprojecteur HS, stores bloqués côté ouest…"></textarea>

        </div>

        <!-- SAUVEGARDE -->

        <div class="module-detail-card">

            <button class="primary-button" id="saveReunion">
                Sauvegarder
            </button>

        </div>

    </div>

    <script src="../js/secteur-config.js"></script>
    <script src="../js/building-manager.js"></script>
    <script src="../js/photo-manager.js"></script>
    <script src="../js/unsaved-guard.js"></script>
    <script src="../js/lot-mapping.js"></script>
    <script src="../js/equipment-database.js"></script>
    <script src="../js/reunion-detail.js"></script>

</body>

</html>
