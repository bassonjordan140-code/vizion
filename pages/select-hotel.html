<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hôtels</title>

    <link rel="stylesheet"
          href="../css/style.css">
</head>

<body>

    <div class="container">

        <button class="back-icon-button"
                onclick="window.location.href='../index.html'">
            ←
        </button>

        <h1>Hôtels</h1>

        <p class="subtitle">
            Ouvrez un hôtel pour continuer son audit, ou ajoutez-en un nouveau.
        </p>

        <!-- Liste des hôtels déjà commencés -->
        <div id="hotelsDashboard" class="dashboard-list"></div>

        <p id="noHotelsHint" class="section-hint hidden">
            Aucun hôtel pour l'instant — ajoutez-en un ci-dessous.
        </p>

        <div class="module-detail-card">

            <h2 class="section-title">Ajouter un hôtel</h2>

            <div class="field-group">
                <label for="hotelSelect">Hôtel</label>
                <select id="hotelSelect">
                    <option value="">— Sélectionner un hôtel —</option>
                </select>
            </div>

            <div id="hotelPreview" class="section-hint hidden"></div>

            <button type="button"
                    class="secondary-button"
                    id="continueButton"
                    disabled>
                + Ajouter cet hôtel
            </button>

        </div>

    </div>

    <script src="../js/secteur-config.js"></script>
    <script src="../js/photo-manager.js"></script>
    <script src="../js/building-manager.js"></script>
    <script src="../js/hotel-manager.js"></script>
    <script src="../js/hotels-data.js"></script>
    <script src="../js/select-hotel.js"></script>

</body>

</html>
