<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Secteurs</title>

    <link rel="stylesheet"
          href="../css/style.css">
</head>

<body>

    <div class="container">

        <div class="page-nav-row">
        <button class="back-icon-button"
                id="backToHomeButton">
            ←
        </button>

        <button class="back-icon-button" onclick="window.location.href='site-info.html'" aria-label="Informations du site">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 11.5 12 4l8 7.5"></path>
                <path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"></path>
            </svg>
        </button>
        </div>

        <h1>Secteurs</h1>

        <p class="subtitle">
            Choisissez un secteur pour gérer ses localisations.
        </p>

        <div class="dashboard-list"
             id="secteurDashboard">
        </div>

        <p id="noSecteursHint" class="section-hint hidden">
            Aucun secteur pour l'instant — ajoutez-en un ci-dessous.
        </p>

        <div class="module-detail-card" id="addSecteurCard">
            <h2 class="section-title">Ajouter un secteur</h2>
            <div class="field-group">
                <label for="addSecteurSelect">Secteur</label>
                <select id="addSecteurSelect"></select>
            </div>
            <button type="button" id="addSecteurBtn" class="secondary-button">
                + Ajouter ce secteur
            </button>
        </div>

        <div class="module-detail-card">
            <h2 class="section-title">Secteur non listé ?</h2>
            <p class="section-hint">
                Si le secteur à auditer ne fait pas partie de la liste ci-dessus,
                ajoutez-le librement ici.
            </p>
            <div class="field-group">
                <label for="newCustomSecteurInput">Nom du secteur</label>
                <input type="text" id="newCustomSecteurInput" placeholder="Ex : Local technique, Blanchisserie extérieure…">
            </div>
            <button type="button" id="addCustomSecteurBtn" class="secondary-button">
                + Ajouter ce secteur personnalisé
            </button>
        </div>

    </div>

    <script src="../js/secteur-config.js"></script>
    <script src="../js/photo-manager.js"></script>
    <script src="../js/building-manager.js"></script>
    <script src="../js/progress.js"></script>
    <script src="../js/script.js"></script>

</body>

</html>
